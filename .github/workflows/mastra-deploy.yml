name: Deploy Mastra

on:
  push:
    branches:
      - main
    paths:
      - 'src/mastra/**'
      - 'package.json'
      - 'package-lock.json'
      - '.mastra-project.json'
      - '.github/workflows/mastra-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy server
        run: npx mastra deploy --env production --yes
        env:
          MASTRA_API_TOKEN: ${{ secrets.MASTRA_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_PROGRAMS_PROJECT_GID: ${{ secrets.ASANA_PROGRAMS_PROJECT_GID }}
          ASANA_KOACHEX_PROJECT_GID: ${{ secrets.ASANA_KOACHEX_PROJECT_GID }}
          SLACK_PROGRAMS_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_PROGRAMS_RELEASE_WEBHOOK_URL }}
          SLACK_KOACHEX_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_KOACHEX_RELEASE_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  deploy-studio:
    runs-on: ubuntu-latest
    needs: deploy-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy studio
        run: npx mastra studio deploy --project product-management-control --yes
        env:
          MASTRA_API_TOKEN: ${{ secrets.MASTRA_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_PROGRAMS_PROJECT_GID: ${{ secrets.ASANA_PROGRAMS_PROJECT_GID }}
          ASANA_KOACHEX_PROJECT_GID: ${{ secrets.ASANA_KOACHEX_PROJECT_GID }}
          SLACK_PROGRAMS_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_PROGRAMS_RELEASE_WEBHOOK_URL }}
          SLACK_KOACHEX_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_KOACHEX_RELEASE_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}